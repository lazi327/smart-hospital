# Render Blueprint —— 智慧医院服务系统（Spring Boot 3.4.5 + Spring AI + 外部 MySQL）
# Render 无原生 Java runtime，因此使用 runtime: docker + 仓库根目录的 Dockerfile 构建。
services:
  - type: web
    name: smart-hospital
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # ===== 外部 MySQL（必填，Dashboard 中填写，sync: false 表示不进版本库）=====
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # ===== AI 导诊用的 DeepSeek Key，留空则 AI 功能返回友好提示 =====
      - key: DEEPSEEK_API_KEY
        sync: false
      # ===== 时区，保证号源日期与排班按北京时间计算 =====
      - key: TZ
        value: Asia/Shanghai
