<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 智慧医院</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { display: flex; min-height: 100vh; }
  .auth-left {
    flex: 1; position: relative;
    background: linear-gradient(135deg, #0a1628 0%, #0f1e35 50%, #142a45 100%);
    display: flex; flex-direction: column; justify-content: center;
    padding: 60px; overflow: hidden;
  }
  .auth-left::before {
    content: ''; position: absolute; width: 500px; height: 500px;
    border-radius: 50%; background: var(--brand-gradient); filter: blur(100px);
    opacity: .15; top: -100px; left: -100px;
  }
  .auth-brand { display: flex; align-items: center; gap: 12px; font-family: "Noto Serif SC", serif; font-size: 22px; font-weight: 700; margin-bottom: 60px; position: relative; }
  .auth-brand .logo { width: 44px; height: 44px; border-radius: 13px; background: var(--brand-gradient); display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: var(--brand-glow); }
  .auth-left h1 { font-size: 44px; line-height: 1.3; margin-bottom: 20px; position: relative; }
  .auth-left h1 .grad { background: var(--brand-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .auth-left p { font-size: 17px; color: var(--text-3); line-height: 1.8; max-width: 440px; position: relative; }

  .auth-right {
    width: 480px; background: var(--bg-surface); border-left: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; padding: 40px;
  }
  .auth-box { width: 100%; max-width: 380px; }
  .auth-box h2 { font-size: 28px; margin-bottom: 8px; }
  .auth-box .sub { color: var(--text-3); margin-bottom: 28px; font-size: 14.5px; }
  .form-item { margin-bottom: 16px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .auth-box .btn-block { margin-top: 8px; padding: 13px; font-size: 15px; }
  .auth-foot { text-align: center; margin-top: 20px; color: var(--text-3); font-size: 13.5px; }
  @media (max-width: 900px) { .auth-left { display: none; } .auth-right { width: 100%; border: none; } }
</style>
</head>
<body>
<div class="auth-left">
  <div class="auth-brand"><div class="logo">✚</div>智慧医院</div>
  <h1>开启您的<br><span class="grad">智慧就医之旅</span></h1>
  <p>注册即可享受 AI 智能导诊、在线预约挂号、远程问诊、健康档案管理等全部智慧医疗服务。</p>
</div>

<div class="auth-right">
  <div class="auth-box">
    <h2>创建账户</h2>
    <p class="sub">填写以下信息完成注册</p>
    <div class="form-item">
      <label>登录账号</label>
      <input class="input" id="username" placeholder="设置登录账号">
    </div>
    <div class="form-grid">
      <div class="form-item">
        <label>姓名</label>
        <input class="input" id="name" placeholder="真实姓名">
      </div>
      <div class="form-item">
        <label>手机号</label>
        <input class="input" id="phone" placeholder="11位手机号">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-item">
        <label>密码</label>
        <input class="input" id="password" type="password" placeholder="至少6位">
      </div>
      <div class="form-item">
        <label>确认密码</label>
        <input class="input" id="password2" type="password" placeholder="再次输入">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-item">
        <label>性别</label>
        <select class="input" id="gender">
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </div>
      <div class="form-item">
        <label>年龄</label>
        <input class="input" id="age" type="number" placeholder="年龄">
      </div>
    </div>
    <button class="btn btn-primary btn-block" onclick="register()">注 册</button>
    <div class="auth-foot">已有账号？<a href="login.html">立即登录</a></div>
  </div>
</div>

<script>
async function register() {
  const u = document.getElementById('username').value.trim();
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const p1 = document.getElementById('password').value;
  const p2 = document.getElementById('password2').value;
  const gender = document.getElementById('gender').value;
  const age = document.getElementById('age').value;
  if (!u || !name || !p1) return alert('请填写必填项');
  if (p1 !== p2) return alert('两次密码不一致');
  try {
    const res = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p1, name, phone, gender, age: age ? Number(age) : null }) });
    const data = await res.json();
    if (data.code !== 200) return alert(data.message);
    localStorage.setItem('token', data.data.token);
    localStorage.setItem('user', JSON.stringify(data.data.user));
    location.href = 'index.html';
  } catch (e) { alert('注册失败'); }
}
</script>
</body>
</html>
