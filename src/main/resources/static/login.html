<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 智慧医院</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { display: flex; min-height: 100vh; }
  .auth-left {
    flex: 1; position: relative;
    background: linear-gradient(135deg, #0a1628 0%, #0f1e35 50%, #142a45 100%);
    display: flex; flex-direction: column; justify-content: center;
    padding: 60px; overflow: hidden;
  }
  .auth-left::before {
    content: ''; position: absolute; width: 500px; height: 500px;
    border-radius: 50%; background: var(--brand-gradient); filter: blur(100px);
    opacity: .15; top: -100px; left: -100px;
  }
  .auth-left::after {
    content: ''; position: absolute; width: 400px; height: 400px;
    border-radius: 50%; background: var(--accent); filter: blur(120px);
    opacity: .08; bottom: -80px; right: -80px;
  }
  .auth-brand { display: flex; align-items: center; gap: 12px; font-family: "Noto Serif SC", serif; font-size: 22px; font-weight: 700; margin-bottom: 60px; position: relative; }
  .auth-brand .logo { width: 44px; height: 44px; border-radius: 13px; background: var(--brand-gradient); display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: var(--brand-glow); }
  .auth-left h1 { font-size: 44px; line-height: 1.3; margin-bottom: 20px; position: relative; }
  .auth-left h1 .grad { background: var(--brand-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .auth-left p { font-size: 17px; color: var(--text-3); line-height: 1.8; max-width: 440px; position: relative; }
  .auth-features { margin-top: 50px; display: flex; gap: 30px; position: relative; }
  .auth-feat { text-align: center; }
  .auth-feat .n { font-size: 32px; font-weight: 700; font-family: "Noto Serif SC", serif; background: var(--brand-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .auth-feat .l { font-size: 13px; color: var(--text-3); }

  .auth-right {
    width: 480px; background: var(--bg-surface); border-left: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; padding: 40px;
  }
  .auth-box { width: 100%; max-width: 380px; }
  .auth-box h2 { font-size: 28px; margin-bottom: 8px; }
  .auth-box .sub { color: var(--text-3); margin-bottom: 32px; font-size: 14.5px; }
  .role-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  .role-tab { flex: 1; padding: 11px; border-radius: 12px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 600; background: var(--glass); border: 1px solid var(--border); color: var(--text-2); transition: all .2s; }
  .role-tab.active { background: var(--brand-gradient); color: #fff; border-color: transparent; box-shadow: 0 4px 14px rgba(14,165,164,0.3); }
  .form-item { margin-bottom: 18px; }
  .auth-box .btn-block { margin-top: 8px; padding: 13px; font-size: 15px; }
  .auth-foot { text-align: center; margin-top: 24px; color: var(--text-3); font-size: 13.5px; }
  .demo { margin-top: 20px; padding: 14px; background: var(--glass); border: 1px solid var(--border); border-radius: 12px; font-size: 12.5px; color: var(--text-3); }
  .demo b { color: var(--text-2); }
  @media (max-width: 900px) { .auth-left { display: none; } .auth-right { width: 100%; border: none; } }
</style>
</head>
<body>
<div class="auth-left">
  <div class="auth-brand"><div class="logo">✚</div>智慧医院</div>
  <h1>让健康<br><span class="grad">触手可及</span></h1>
  <p>融合人工智能与尖端医疗技术，为您提供 AI 智能导诊、在线预约挂号、远程问诊、健康档案管理等全流程智慧医疗服务。</p>
  <div class="auth-features">
    <div class="auth-feat"><div class="n">30+</div><div class="l">临床科室</div></div>
    <div class="auth-feat"><div class="n">24h</div><div class="l">在线服务</div></div>
    <div class="auth-feat"><div class="n">98%</div><div class="l">满意度</div></div>
  </div>
</div>

<div class="auth-right">
  <div class="auth-box">
    <h2>欢迎回来</h2>
    <p class="sub">登录您的智慧医院账户</p>
    <div class="role-tabs">
      <div class="role-tab active" data-role="PATIENT" onclick="selectRole('PATIENT')">👤 患者</div>
      <div class="role-tab" data-role="DOCTOR" onclick="selectRole('DOCTOR')">👨‍⚕️ 医生</div>
      <div class="role-tab" data-role="ADMIN" onclick="selectRole('ADMIN')">⚙️ 管理员</div>
    </div>
    <div class="form-item">
      <label>账号</label>
      <input class="input" id="username" placeholder="请输入账号" value="patient">
    </div>
    <div class="form-item">
      <label>密码</label>
      <input class="input" id="password" type="password" placeholder="请输入密码" value="123456" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="btn btn-primary btn-block" onclick="login()">登 录</button>
    <div class="auth-foot">还没有账号？<a href="register.html">立即注册</a></div>
    <div class="demo" id="demo">
      <b>演示账号：</b><br>
      患者 patient / 123456<br>
      医生 doctor1 / 123456<br>
      管理员 admin / admin123
    </div>
  </div>
</div>

<script>
  let role = 'PATIENT';
  function selectRole(r) {
    role = r;
    document.querySelectorAll('.role-tab').forEach(t => t.classList.toggle('active', t.dataset.role === r));
    const map = { PATIENT: ['patient', '123456'], DOCTOR: ['doctor1', '123456'], ADMIN: ['admin', 'admin123'] };
    document.getElementById('username').value = map[r][0];
    document.getElementById('password').value = map[r][1];
  }
  async function login() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    if (!u || !p) return;
    try {
      const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
      const data = await res.json();
      if (data.code !== 200) { alert(data.message); return; }
      localStorage.setItem('token', data.data.token);
      localStorage.setItem('user', JSON.stringify(data.data.user));
      const redirect = new URLSearchParams(location.search).get('redirect');
      const home = data.data.user.role === 'DOCTOR' ? 'workbench.html' : data.data.user.role === 'ADMIN' ? 'admin.html' : 'index.html';
      location.href = redirect || home;
    } catch (e) { alert('登录失败'); }
  }
</script>
</body>
</html>
