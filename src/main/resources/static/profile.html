<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 智慧医院</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
    }

    .profile-card {
      padding: 28px;
      text-align: center;
      position: sticky;
      top: 90px;
    }

    .profile-card .avatar-lg {
      margin: 0 auto 14px;
    }

    .profile-card .name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .profile-card .role {
      display: inline-block;
      margin-bottom: 18px;
    }

    .profile-stat {
      display: flex;
      justify-content: space-around;
      padding: 16px 0;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }

    .profile-stat .n {
      font-size: 22px;
      font-weight: 700;
      color: var(--brand-2);
    }

    .profile-stat .l {
      font-size: 12px;
      color: var(--text-3);
    }

    .menu {
      margin-top: 20px;
      text-align: left;
    }

    .menu-item {
      padding: 11px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14.5px;
      color: var(--text-2);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all .2s;
    }

    .menu-item:hover {
      background: var(--glass);
      color: var(--text-1);
    }

    .menu-item.active {
      background: var(--brand-gradient-soft);
      color: var(--brand-3);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .appt-item {
      padding: 18px;
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: center;
    }

    .appt-item .avatar-md {
      grid-row: span 2;
    }

    .appt-item .a-doctor {
      font-size: 16px;
      font-weight: 600;
    }

    .appt-item .a-info {
      font-size: 13px;
      color: var(--text-3);
      margin-top: 4px;
    }

    .appt-item .a-no {
      font-size: 22px;
      font-weight: 700;
      color: var(--brand-2);
      font-family: "Noto Serif SC", serif;
    }

    @media (max-width: 900px) {
      .profile-layout {
        grid-template-columns: 1fr;
      }

      .profile-card {
        position: static;
      }
    }
  </style>
</head>

<body>
  <nav class="nav" id="nav"></nav>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">个人中心</h1>
      <p class="page-sub">管理您的挂号记录与个人信息</p>
    </div>

    <div class="profile-layout">
      <!-- 左侧 -->
      <div class="card profile-card">
        <div class="avatar-lg" id="pAvatar"></div>
        <div class="name" id="pName"></div>
        <span class="tag" id="pRole"></span>
        <div class="profile-stat">
          <div>
            <div class="n" id="statCount">0</div>
            <div class="l">挂号总数</div>
          </div>
          <div>
            <div class="n" id="statDone">0</div>
            <div class="l">已完成</div>
          </div>
        </div>
        <div class="menu">
          <div class="menu-item active" data-tab="appts" onclick="switchTab('appts')">📋 我的挂号</div>
          <div class="menu-item" data-tab="info" onclick="switchTab('info')">👤 个人信息</div>
        </div>
      </div>

      <!-- 右侧内容 -->
      <div>
        <!-- 挂号记录 -->
        <div class="tab-content active" id="tab-appts">
          <div class="card" id="apptList">
            <div class="loading">
              <div class="spinner"></div>
            </div>
          </div>
        </div>

        <!-- 个人信息 -->
        <div class="tab-content" id="tab-info">
          <div class="card">
            <h3 style="margin-bottom:18px">个人信息</h3>
            <div class="form-grid">
              <div class="form-item"><label>姓名</label><input class="input" id="infoName"></div>
              <div class="form-item"><label>手机号</label><input class="input" id="infoPhone"></div>
              <div class="form-item"><label>性别</label><select class="input" id="infoGender">
                  <option>男</option>
                  <option>女</option>
                </select></div>
              <div class="form-item"><label>年龄</label><input class="input" id="infoAge" type="number"></div>
            </div>
            <div class="form-item"><label>身份证号</label><input class="input" id="infoIdCard" placeholder="选填"></div>
            <div class="form-item"><label>地址</label><input class="input" id="infoAddress" placeholder="选填"></div>
            <button class="btn btn-primary" onclick="saveInfo()">保存修改</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    requireRole('PATIENT');
    renderNav('profile.html');
    const u = getUser();
    document.getElementById('pAvatar').textContent = u.name.charAt(0);
    document.getElementById('pName').textContent = u.name;
    const roleMap = { PATIENT: '患者', DOCTOR: '医生', ADMIN: '管理员' };
    document.getElementById('pRole').textContent = roleMap[u.role] || u.role;

    function switchTab(t) {
      document.querySelectorAll('.menu-item').forEach(m => m.classList.toggle('active', m.dataset.tab === t));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById('tab-' + t).classList.add('active');
    }

    async function loadAppts() {
      const list = await api('/api/appointments/mine');
      const statusMap = { BOOKED: { text: '已预约', cls: '' }, CANCELLED: { text: '已取消', cls: 'danger' }, FINISHED: { text: '已完成', cls: 'success' } };
      document.getElementById('statCount').textContent = list.length;
      document.getElementById('statDone').textContent = list.filter(a => a.status === 'FINISHED').length;
      if (!list.length) {
        document.getElementById('apptList').innerHTML = '<div class="empty"><div class="empty-icon">📋</div>暂无挂号记录，<a href="appointments.html">去挂号</a></div>';
        return;
      }
      document.getElementById('apptList').innerHTML = list.map(a => {
        const st = statusMap[a.status] || { text: a.status, cls: 'gray' };
        return `<div class="card appt-item">
        <div class="avatar-md">${escapeHtml(a.doctorName.charAt(0))}</div>
        <div>
          <div class="a-doctor">${escapeHtml(a.doctorName)} <span class="tag gray">${escapeHtml(a.title)}</span></div>
          <div class="a-info">${escapeHtml(a.departmentName)} · ${fmtDate(a.date)} ${weekOf(a.date)} ${periodText(a.period)}</div>
          <div class="a-info">挂号序号：<b class="text-brand">${a.queueNo}</b> 号</div>
        </div>
        <div style="text-align:right">
          <div class="a-no">${a.queueNo}</div>
          <span class="tag ${st.cls}">${st.text}</span>
          ${a.status === 'BOOKED' ? `<div style="margin-top:8px"><button class="btn btn-danger btn-sm" onclick="cancel(${a.id})">取消挂号</button></div>` : ''}
        </div>
      </div>`;
      }).join('');
    }

    async function cancel(id) {
      if (!confirm('确认取消该挂号？')) return;
      try { await api('/api/appointments/' + id + '/cancel', { method: 'POST' }); toast('已取消'); loadAppts(); }
      catch (e) { toast(e.message, true); }
    }

    async function loadInfo() {
      const p = await api('/api/auth/me');
      document.getElementById('infoName').value = p.name || '';
      document.getElementById('infoPhone').value = p.phone || '';
      document.getElementById('infoGender').value = p.gender || '男';
      document.getElementById('infoAge').value = p.age || '';
      document.getElementById('infoIdCard').value = p.idCard || '';
      document.getElementById('infoAddress').value = p.address || '';
    }

    async function saveInfo() {
      try {
        await api('/api/auth/me', {
          method: 'PUT', body: {
            name: document.getElementById('infoName').value,
            phone: document.getElementById('infoPhone').value,
            gender: document.getElementById('infoGender').value,
            age: Number(document.getElementById('infoAge').value) || null,
            idCard: document.getElementById('infoIdCard').value,
            address: document.getElementById('infoAddress').value
          }
        });
        const user = getUser(); user.name = document.getElementById('infoName').value;
        localStorage.setItem('user', JSON.stringify(user));
        toast('保存成功'); renderNav('profile.html');
        document.getElementById('pAvatar').textContent = user.name.charAt(0);
        document.getElementById('pName').textContent = user.name;
      } catch (e) { toast(e.message, true); }
    }

    loadAppts();
    loadInfo();
  </script>
</body>

</html>
