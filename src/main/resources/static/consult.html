<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线问诊 - 智慧医院</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .consult-layout { display: grid; grid-template-columns: 320px 1fr; gap: 24px; min-height: calc(100vh - 200px); }
  .dept-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .dept-pill { padding: 7px 14px; border-radius: 100px; background: var(--glass); border: 1px solid var(--border); font-size: 13px; cursor: pointer; transition: all .2s; color: var(--text-2); }
  .dept-pill.active { background: var(--brand-gradient); color: #fff; border-color: transparent; }
  .doctor-card { padding: 16px; margin-bottom: 10px; cursor: pointer; transition: all .2s; }
  .doctor-card:hover { transform: translateY(-2px); border-color: var(--brand-1); }
  .doctor-card .row { margin-bottom: 8px; }
  .doctor-card .d-name { font-size: 16px; font-weight: 600; }
  .doctor-card .d-info { font-size: 12.5px; color: var(--text-3); }
  .chat-panel { display: flex; flex-direction: column; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; backdrop-filter: blur(20px); }
  .chat-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .chat-header .avatar-md { width: 42px; height: 42px; font-size: 18px; }
  .chat-messages { flex: 1; padding: 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; min-height: 300px; }
  .msg { max-width: 80%; display: flex; gap: 10px; align-items: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .m-avatar { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .msg.user .m-avatar { background: var(--glass-strong); }
  .msg.ai .m-avatar { background: var(--brand-gradient); }
  .m-bubble { padding: 12px 16px; border-radius: 14px; font-size: 14.5px; line-height: 1.7; }
  .msg.ai .m-bubble { background: var(--glass); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.user .m-bubble { background: var(--brand-gradient); color: #fff; border-top-right-radius: 4px; }
  .chat-input { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .empty-chat { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-4); text-align: center; padding: 40px; }
  .empty-chat .icon { font-size: 56px; margin-bottom: 16px; opacity: .5; }
  @media (max-width: 900px) { .consult-layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav class="nav" id="nav"></nav>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">在线问诊</h1>
    <p class="page-sub">选择医生，开启图文在线咨询</p>
  </div>

  <div class="consult-layout">
    <!-- 左侧：科室 + 医生 -->
    <div>
      <div class="dept-picker" id="deptPicker"></div>
      <div id="doctorList"><div class="loading"><div class="spinner"></div></div></div>
    </div>

    <!-- 右侧：聊天 -->
    <div class="chat-panel">
      <div class="chat-header" id="chatHeader" style="display:none">
        <div class="avatar-md" id="chatAvatar"></div>
        <div>
          <div style="font-weight:600" id="chatName"></div>
          <div style="font-size:12.5px;color:var(--text-3)"><span class="dot live"></span> 在线</div>
        </div>
      </div>
      <div class="chat-messages" id="messages">
        <div class="empty-chat" id="emptyChat">
          <div class="icon">💬</div>
          <h3>请选择左侧医生开始问诊</h3>
          <p class="muted" style="margin-top:8px">支持图文咨询，医生将为您解答健康问题</p>
        </div>
      </div>
      <div class="chat-input" id="chatInput" style="display:none">
        <input class="input" id="msgInput" placeholder="请描述您的问题..." onkeydown="if(event.key==='Enter')sendMsg()">
        <button class="btn btn-primary" onclick="sendMsg()">发送</button>
      </div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
  requireRole('PATIENT');
  renderNav('consult.html');
  let currentDoctor = null;
  let sessionId = null;

  (async () => {
    const depts = await api('/api/departments');
    document.getElementById('deptPicker').innerHTML = '<div class="dept-pill active" data-id="">全部</div>' +
      depts.map(d => `<div class="dept-pill" data-id="${d.id}">${escapeHtml(d.name)}</div>`).join('');
    document.querySelectorAll('.dept-pill').forEach(p => p.addEventListener('click', () => {
      document.querySelectorAll('.dept-pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      loadDoctors(p.dataset.id);
    }));
    loadDoctors('');
  })();

  async function loadDoctors(deptId) {
    const url = deptId ? '/api/doctors?departmentId=' + deptId : '/api/doctors';
    const docs = await api(url);
    if (!docs.length) {
      document.getElementById('doctorList').innerHTML = '<div class="muted" style="text-align:center;padding:30px">该科室暂无医生</div>';
      return;
    }
    document.getElementById('doctorList').innerHTML = docs.map(d => `
      <div class="card doctor-card" onclick="selectDoctor(${JSON.stringify(d).replace(/"/g,'&quot;')})">
        <div class="row">
          <div class="avatar-md">${escapeHtml(d.name.charAt(0))}</div>
          <div style="margin-left:8px">
            <div class="d-name">${escapeHtml(d.name)} <span class="tag" style="font-size:11px">${escapeHtml(d.title)}</span></div>
            <div class="d-info">${escapeHtml(d.departmentName)}</div>
          </div>
          <div class="spacer"></div>
          <span class="dot live" title="在线"></span>
        </div>
        <div class="d-info">专长：${escapeHtml(d.specialty || '综合诊疗')}</div>
      </div>`).join('');
  }

  function selectDoctor(d) {
    currentDoctor = d;
    sessionId = 'consult_' + d.id + '_' + Date.now();
    document.getElementById('chatHeader').style.display = 'flex';
    document.getElementById('chatInput').style.display = 'flex';
    document.getElementById('chatAvatar').textContent = d.name.charAt(0);
    document.getElementById('chatName').textContent = d.name + ' · ' + d.title;
    document.getElementById('emptyChat').style.display = 'none';
    document.getElementById('messages').innerHTML = `
      <div class="msg ai">
        <div class="m-avatar">${escapeHtml(d.name.charAt(0))}</div>
        <div class="m-bubble">您好，我是 ${escapeHtml(d.name)} 医生。请问有什么可以帮您？请详细描述您的症状或健康问题。</div>
      </div>`;
  }

  async function sendMsg() {
    const input = document.getElementById('msgInput');
    const msg = input.value.trim();
    if (!msg || !currentDoctor) return;
    input.value = '';
    appendMsg('user', msg);

    const typing = appendMsg('ai', '<div class="typing" style="display:flex;gap:5px"><span style="width:7px;height:7px;border-radius:50%;background:var(--text-4);animation:typing 1.2s infinite"></span><span style="width:7px;height:7px;border-radius:50%;background:var(--text-4);animation:typing 1.2s .2s infinite"></span><span style="width:7px;height:7px;border-radius:50%;background:var(--text-4);animation:typing 1.2s .4s infinite"></span></div>');

    try {
      const res = await fetch('/api/ai/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Auth-Token': localStorage.getItem('token') || '' },
        body: JSON.stringify({ sessionId, message: '我咨询的医生是' + currentDoctor.name + '，问题：' + msg })
      });
      const data = await res.json();
      if (data.code !== 200) throw new Error(data.message);
      typing.querySelector('.m-bubble').innerHTML = escapeHtml(data.data.reply);
    } catch (e) {
      typing.querySelector('.m-bubble').innerHTML = '抱歉，医生暂时无法回复，请稍后再试。';
    }
  }

  function appendMsg(role, html) {
    const box = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = `<div class="m-avatar">${role === 'ai' ? (currentDoctor ? currentDoctor.name.charAt(0) : '👨‍⚕️') : '👤'}</div><div class="m-bubble">${html}</div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }
</script>
</body>
</html>
